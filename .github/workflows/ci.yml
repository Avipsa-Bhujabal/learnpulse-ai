name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python-version }}'}
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall learnpulse
      - run: python -m unittest discover -s tests -v
      - run: python -m learnpulse.release_audit_cli --repository .
      - run: python -m unittest tests.test_scoring_api tests.test_reference_model -v
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t learnpulse-reference .
